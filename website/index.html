<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page</title>
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>

<body>
    <div class="container">
        <div class="login">
            <div class="hero">
                <div class="message">
                    <h1>Welcome to the website</h1>
                    <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed </br>
                        do eiusmod tempor incididunt ut laboreet dolore</p>
                </div>
            </div>
            <div class="form">
                <h1>USER LOGIN</h1>
                <div class="info">
                    <div class="user">
                        <div>
                            <img src="Images/user.png">
                            <input id="user" name="user" class="text" type="text" value="Username" />
                        </div>
                    </div>
                    <br />
                    <div class="pass">
                        <div>
                            <img src="Images/padlock.png">
                            <input id="pass" name="pass" class="text" type="text" value="Password" />
                        </div>
                    </div>
                </div>
                <div class="help">
                    <ul>
                        <li><a href="#" style="text-decoration:none">Remember</a></li>
                        <li><a href="#" style="text-decoration:none">Forgot Password?</a></li>
                    </ul>
                </div>
                <div class="button">
                    <button type="button">Login</button>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
